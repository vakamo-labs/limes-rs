[package]
name = "limes"
version = "0.8.0"
readme = "README.md"
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Fast token authentication for axum, tonic and tower: JWTs from any OpenID Connect (OIDC) provider, like Keycloak or Entra ID, and Kubernetes service account tokens, with keys and results cached."
keywords = ["authentication", "jwt", "oidc", "axum", "jwks"]
categories = ["authentication", "web-programming::http-server", "network-programming"]

[package.metadata.docs.rs]
# document all features
all-features = true
# The `kubernetes` feature needs a Kubernetes version, which a library leaves to the binary.
features = ["k8s-openapi/latest"]

[features]
all = ["kubernetes", "rustls-tls", "jwks", "axum", "valuable", "cache"]
default = ["rustls-tls", "jwks", "aws-lc-rs"]
kubernetes = ["kube", "k8s-openapi", "dep:tokio", "dep:base64"]
rustls-tls = ["kube?/rustls-tls", "reqwest/rustls"]
aws-lc-rs = ["jsonwebtoken/aws_lc_rs", "dep:aws-lc-rs", "kube?/aws-lc-rs"]
rust-crypto = ["jsonwebtoken/rust_crypto", "dep:getrandom", "dep:hmac", "dep:sha2"]
ring = ["kube?/ring"]
jwks = ["dep:tokio"]
axum = ["dep:axum", "axum-extra"]
valuable = ["dep:valuable"]
cache = ["dep:quick_cache", "dep:tokio"]

[dependencies]
# The `aws-lc-rs` backend, also built by jsonwebtoken; the cache computes its keys with its HMAC.
aws-lc-rs = { version = "1.15", optional = true }
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.12", optional = true, features = ["typed-header"] }
# Already built by jsonwebtoken; decodes the payload of a Kubernetes token for its `exp`.
base64 = { version = "0.23", optional = true }
bytes = "1"
# The `rust-crypto` backend, in the versions jsonwebtoken's `rust_crypto` builds; the cache
# computes its keys with their HMAC.
getrandom = { version = "0.4", optional = true }
hmac = { version = "0.13", optional = true }
http = "1"
http-body-util = "0.1"
# The `aws-lc-rs` and `rust-crypto` features choose its crypto backend.
jsonwebtoken = { version = "12.0" }
# No version feature here: per k8s-openapi's guidance a library must let the final
# binary crate choose the Kubernetes version. The version is selected in dev-dependencies
# (for our own tests) and by consumers (see the `kubernetes` feature docs).
k8s-openapi = { version = "0.29", optional = true }
kube = { version = "5.1", default-features = false, features = [
    "client",
], optional = true }
quick_cache = { version = "0.7", default-features = false, optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
sha2 = { version = "0.11", optional = true }
thiserror = { version = "2.0" }
tokio = { version = "1.43", default-features = false, features = [
    "rt",
    "sync",
    "time",
], optional = true }
tower-layer = "0.3"
tower-service = "0.3"
tracing = { version = "^0.1", features = ["attributes"] }
typed-builder = "0.23"
url = { version = "2.5", features = ["serde"] }
valuable = { version = "0.1.1", optional = true, features = ["derive"] }

[dev-dependencies]
aws-lc-rs = "1"
axum = { version = "0.8" }
base64 = "0.23"
# Tests sign tokens, so they need a backend also without the `aws-lc-rs` and `rust-crypto`
# features. With `rust-crypto` both are enabled, and the tests install one.
jsonwebtoken = { version = "12.0", features = ["aws_lc_rs"] }
# Select a Kubernetes version for the crate's own tests only (not forced on consumers).
k8s-openapi = { version = "0.29", features = ["v1_33"] }
pretty_assertions = "1.4"
tokio = { version = "1.43", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "test-util",
] }
tonic = "0.14"
tonic-health = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing-test = "0.2.5"
