[package]
name = "limes-example-multi-tenant"
version = "0.0.1"
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }

[dependencies]
axum = { version = "0.8" }
# limes leaves the Kubernetes version choice to the binary crate, so we select it here.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
limes = { path = "../../crates/limes", default-features = false, features = [
    "jwks",
    "rustls-tls",
    "kubernetes",
    "aws-lc-rs",
] }
tokio = { version = "1.43", features = ["rt-multi-thread"] }
